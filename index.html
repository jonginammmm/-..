<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pulsing Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Three.js va OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <canvas id="webgl"></canvas>

    <script>
        // Videoda ko'rsatilgan requestAnimationFrame polyfill logikasi
        window.requestAnimationFrame = (function() {
            return window.requestAnimationFrame ||
                window.webkitRequestAnimationFrame ||
                window.mozRequestAnimationFrame ||
                window.oRequestAnimationFrame ||
                window.msRequestAnimationFrame ||
                function(callback) {
                    window.setTimeout(callback, 1000 / 60);
                };
        })();

        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('webgl');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 180;

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Sichqoncha/qol bilan burib boshqarish
            const controls = new THREE.OrbitControls(camera, canvas);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 3D Yurak Nuqtalari Matematik Formulasi (3D Heart Surface Equation)
            const particlesCount = 8000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);

            const colorCore = new THREE.Color('#ff0033');
            const colorEdge = new THREE.Color('#ff6688');

            let index = 0;
            while (index < particlesCount) {
                // Tasodifiy nuqta koordinatalari
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI - Math.PI / 2;

                // 3D Yurak parametri kordinatalari
                const x = 16 * Math.pow(Math.sin(u), 3);
                const y = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
                const z = (Math.random() - 0.5) * 15;

                // Masshtab va tarqalish
                const scale = 4.5;
                positions[index * 3] = x * scale + (Math.random() - 0.5) * 5;
                positions[index * 3 + 1] = y * scale + (Math.random() - 0.5) * 5;
                positions[index * 3 + 2] = z * scale;

                // Markaz va chetki ranglar aralashmasi
                const mixedColor = colorCore.clone().lerp(colorEdge, Math.random() * 0.5);
                colors[index * 3] = mixedColor.r;
                colors[index * 3 + 1] = mixedColor.g;
                colors[index * 3 + 2] = mixedColor.b;

                index++;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.8,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.9
            });

            const heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);

            // Ekran o'lchamiga moslashuv
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Animatsiya sikli (Urib turuvchi va tebranuvchi yurak)
            let clock = new THREE.Clock();

            function render() {
                const elapsedTime = clock.getElapsedTime();

                // Pulsatsiyalanish (Yurak urish dinamikasi)
                const pulse = 1 + Math.sin(elapsedTime * 4) * 0.08 + Math.sin(elapsedTime * 8) * 0.04;
                heartParticles.scale.set(pulse, pulse, pulse);

                // Yengil o'z o'qida tebranish va aylanish
                heartParticles.rotation.y = Math.sin(elapsedTime * 0.8) * 0.25;
                heartParticles.rotation.z = Math.cos(elapsedTime * 0.5) * 0.1;

                controls.update();
                renderer.render(scene, camera);

                window.requestAnimationFrame(render);
            }

            render();
        });
    </script>
</body>
</html>
